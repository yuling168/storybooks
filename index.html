<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沐勳繪本</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e3edf6;--ink:#1f2f4a;--muted:#5a6b85;--shelf:#b98f62}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a2438;--ink:#eef3fa;--muted:#9fb0c9;--shelf:#7d5f3f}}
:root[data-theme="dark"]{--bg:#1a2438;--ink:#eef3fa;--muted:#9fb0c9;--shelf:#7d5f3f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:40px 14px}
h1{font-size:clamp(28px,7vw,44px);margin:0 0 6px;letter-spacing:.08em}
.sub{margin:0 0 36px;color:var(--muted);font-size:15px}
.shelf{width:100%;max-width:760px}
.row{display:grid;grid-template-columns:repeat(6,1fr);align-items:end;gap:clamp(10px,3vw,28px);padding:0 clamp(8px,3vw,24px)}
.book{display:block;grid-column:span 2;transition:transform .2s}
.row.two{margin-top:34px}
.row.two .book:first-child{grid-column:2/4}
.row.two .book:last-child{grid-column:4/6}
.book:hover,.book:focus-visible{transform:translateY(-8px)}
.book:focus-visible{outline:3px solid var(--ink);outline-offset:4px;border-radius:8px}
.book img{display:block;width:100%;height:auto;border-radius:4px 10px 10px 4px;
  box-shadow:inset 7px 0 0 rgba(0,0,0,.14),0 10px 18px rgba(0,0,0,.28)}
.board{height:16px;margin-top:-2px;background:var(--shelf);border-radius:3px;box-shadow:0 8px 14px rgba(0,0,0,.2)}
.hint{margin-top:34px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.book{transition:none}}
</style>
</head>
